# Optional: builds + publishes the installer whenever you push a tag like v0.2.0
name: Release
on:
  push:
    tags: ['v*']
# The built-in GITHUB_TOKEN is read-only by default; publishing needs to create the release.
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # Electron 44 needs Node >= 22.12
      - run: npm ci
      - name: Write .env from secrets
        shell: bash
        run: |
          printf 'TMDB_API_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nRAWG_API_KEY=%s\nOMDB_API_KEY=%s\n' \
            "${{ secrets.TMDB_API_KEY }}" "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.RAWG_API_KEY }}" "${{ secrets.OMDB_API_KEY }}" > .env
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
